<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" preserveAspectRatio="xMidYMid slice" role="img" aria-label="A cozy living room with a brown leather sofa">
  <rect width="600" height="500" fill="#f1ece4"/>
  <!-- ceiling beams -->
  <rect y="0" width="600" height="26" fill="#e3ddd3"/>
  <g fill="#d6cfc3"><rect x="40" y="0" width="14" height="40"/><rect x="190" y="0" width="14" height="40"/><rect x="340" y="0" width="14" height="40"/><rect x="490" y="0" width="14" height="40"/></g>
  <!-- window -->
  <rect x="40" y="80" width="120" height="190" fill="#fbfaf6" stroke="#d8d1c5" stroke-width="6"/>
  <path d="M100 80v190M40 175h120" stroke="#d8d1c5" stroke-width="4"/>
  <rect x="430" y="80" width="120" height="190" fill="#fbfaf6" stroke="#d8d1c5" stroke-width="6"/>
  <path d="M490 80v190M430 175h120" stroke="#d8d1c5" stroke-width="4"/>
  <!-- frames -->
  <rect x="215" y="120" width="44" height="56" fill="#fff" stroke="#3a3a3a" stroke-width="4"/>
  <rect x="225" y="132" width="24" height="32" fill="#c9c2b6"/>
  <rect x="280" y="140" width="34" height="40" fill="#fff" stroke="#3a3a3a" stroke-width="4"/>
  <!-- floor + rug -->
  <rect y="370" width="600" height="130" fill="#cdb594"/>
  <path d="M0 400h600M0 440h600M0 475h600" stroke="#bfa582" stroke-width="2"/>
  <ellipse cx="280" cy="445" rx="230" ry="42" fill="#efe9de"/>
  <!-- plant -->
  <rect x="372" y="300" width="34" height="40" rx="4" fill="#e9e4da"/>
  <g fill="#5d8a4e"><ellipse cx="389" cy="250" rx="16" ry="40"/><ellipse cx="368" cy="270" rx="12" ry="30" transform="rotate(-30 368 270)"/><ellipse cx="410" cy="268" rx="12" ry="30" transform="rotate(30 410 268)"/><ellipse cx="389" cy="215" rx="10" ry="24" fill="#6f9c5f"/></g>
  <!-- side table + lamp -->
  <rect x="356" y="338" width="66" height="8" rx="2" fill="#7a4a2e"/>
  <rect x="360" y="346" width="5" height="40" fill="#5a3a24"/><rect x="413" y="346" width="5" height="40" fill="#5a3a24"/>
  <!-- sofa -->
  <rect x="70" y="280" width="270" height="70" rx="16" fill="#8a5232"/>
  <rect x="58" y="330" width="294" height="50" rx="12" fill="#9b5d38"/>
  <rect x="84" y="326" width="120" height="20" rx="8" fill="#a8683f"/><rect x="208" y="326" width="120" height="20" rx="8" fill="#a8683f"/>
  <rect x="44" y="306" width="40" height="80" rx="14" fill="#8f5534"/><rect x="326" y="306" width="40" height="80" rx="14" fill="#8f5534"/>
  <rect x="100" y="296" width="44" height="38" rx="8" fill="#d8c08f" transform="rotate(-8 122 315)"/>
  <rect x="62" y="384" width="8" height="16" fill="#3a2a1d"/><rect x="340" y="384" width="8" height="16" fill="#3a2a1d"/>
  <!-- coffee table -->
  <rect x="150" y="405" width="190" height="14" rx="4" fill="#5a3a24"/>
  <rect x="160" y="419" width="7" height="34" fill="#2b2b2b"/><rect x="323" y="419" width="7" height="34" fill="#2b2b2b"/>
  <ellipse cx="205" cy="402" rx="16" ry="5" fill="#efe9de"/><rect x="262" y="394" width="28" height="9" rx="2" fill="#7fb59b"/>
  <!-- ottoman -->
  <rect x="440" y="380" width="110" height="60" rx="12" fill="#9b5d38"/>
  <rect x="450" y="440" width="6" height="14" fill="#3a2a1d"/><rect x="534" y="440" width="6" height="14" fill="#3a2a1d"/>
</svg>
