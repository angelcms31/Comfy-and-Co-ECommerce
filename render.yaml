# Render blueprint for the FastAPI backend (New > Blueprint in the Render dashboard).
# Values marked sync: false are asked for when the blueprint is created, copy them from backend/.env.
services:
  - type: web
    name: comfyco-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      # the Vercel URL of the store, comma separated if there's more than one
      - key: FRONTEND_URLS
        sync: false
      # the inbox that receives the Contact Us messages
      - key: CONTACT_EMAIL_TO
        sync: false
      - key: IMAGE_BUCKET
        value: products
